<!DOCTYPE html>
<html lang="en" data-theme="green">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKER TERMINAL v2.0</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Theme Selector -->
    <div id="theme-selector">
        <div class="theme-btn" data-theme="green" title="Phosphor Green"></div>
        <div class="theme-btn" data-theme="amber" title="Amber"></div>
        <div class="theme-btn" data-theme="cyan" title="Cyan"></div>
        <div class="theme-btn" data-theme="red" title="Red Alert"></div>
        <div class="theme-btn" data-theme="white" title="Phosphor White"></div>
        <div class="theme-btn" data-theme="pink" title="Cyberpunk"></div>
        <div id="readable-toggle" title="Readable Mode" style="width: 20px; height: 20px; border: 2px solid var(--primary); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 10px; color: var(--primary);">👁</div>
    </div>

    <div id="crt-container">
        <div id="screen">
            <div id="header">
                <div>
                    <span class="blink">█</span> ROOT@HACKNET:~#
                </div>
                <div id="stats-bar">
                    <span class="stat-item">₿ 0</span>
                    <span class="stat-item">LVL 1</span>
                    <span class="stat-item">REP 0</span>
                    <span class="stat-item">HACKS 0</span>
                </div>
            </div>
            <div id="output"></div>
            <form id="input-form" style="display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--primary); padding-top: 10px;">
                <span class="prompt">root@hacknet:~$</span>
                <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false" inputmode="text" autocapitalize="none" autocorrect="off" style="flex: 1; background: transparent; border: none; color: var(--primary); font-family: 'VT323', monospace; font-size: 18px; outline: none; caret-color: var(--primary); text-shadow: 0 0 3px var(--shadow);">
                <button type="submit" style="background: var(--primary); color: #000; border: none; font-family: 'VT323', monospace; font-size: 14px; padding: 4px 12px; cursor: pointer;">ENTER</button>
            </form>
        </div>
        
        <!-- CRT Effects -->
        <div class="scanline"></div>
        <div class="scanline-moving"></div>
        <div class="crt-flicker"></div>
        <div class="vignette"></div>
        <div class="noise"></div>
    </div>
    
    <!-- Minigame Overlay -->
    <div id="minigame-overlay">
        <div class="minigame-title">BREACH PROTOCOL</div>
        <div>Type the code to bypass security:</div>
        <div class="hack-target">ROOT</div>
        <input type="text" class="hack-input" autocomplete="off" spellcheck="false">
        <div class="progress-bar-container">
            <div class="progress-bar"></div>
        </div>
        <div style="font-size: 14px; margin-top: 10px; color: var(--primary-dim);">Press ESC to abort</div>
    </div>
    
    <!-- Achievement Popup -->
    <div id="achievement-popup">
        <div class="achievement-title">🏆 Achievement Unlocked</div>
        <div class="achievement-desc">Description here</div>
    </div>
    
    <!-- Debug Panel -->
    <div id="debug-info" style="position: fixed; bottom: 10px; right: 10px; background: rgba(0,0,0,0.8); color: #ff0; padding: 10px; font-size: 12px; border: 1px solid #ff0; z-index: 1000; max-width: 300px;">
        <div>Status: <span id="debug-status">loading...</span></div>
        <div>Input: <span id="debug-input">-</span></div>
        <div>Cmd: <span id="debug-cmd">-</span></div>
    </div>
    
    <script src="bundle.js"></script>
    <script>
        // Immediate test: show JS is working
        document.addEventListener('DOMContentLoaded', () => {
            const output = document.getElementById('output');
            if (output) {
                const testLine = document.createElement('div');
                testLine.className = 'line success';
                testLine.textContent = '[SYSTEM] Terminal initialized. Type "help" and press ENTER.';
                output.appendChild(testLine);
            }
        });
    </script>
</body>
</html>
